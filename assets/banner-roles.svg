<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 256" width="1024" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22499f"/><stop offset="55%" stop-color="#12295e"/><stop offset="100%" stop-color="#070f24"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe89a"/><stop offset="55%" stop-color="#e6b422"/><stop offset="100%" stop-color="#b3830f"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1024" height="256" rx="18"/></clipPath>
