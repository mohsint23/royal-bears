      <circle cx="160" cy="212" r="48" fill="#e6b422"/><circle cx="352" cy="212" r="48" fill="#e6b422"/>
      <path d="M256 168 L364 212 L378 304 L318 396 L256 420 L194 396 L134 304 L148 212 Z" fill="#e6b422"/>
    </g>
    <!-- diagonal accent -->
    <path d="M0 256 L150 0 L196 0 L46 256 Z" fill="#e6b422" opacity="0.16"/>
    <text x="72" y="84" font-family="Helvetica-Bold, Helvetica, Arial, sans-serif" font-size="26"
          font-weight="bold" fill="url(#gold)" letter-spacing="7">ROYAL BEARS</text>
    <text x="72" y="152" font-family="Helvetica-Bold, Helvetica, Arial, sans-serif" font-size="60"
