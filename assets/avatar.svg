<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="78%">
      <stop offset="0%" stop-color="#2f66e0"/>
      <stop offset="58%" stop-color="#1b3f96"/>
      <stop offset="100%" stop-color="#0a1730"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7d97a"/>
      <stop offset="46%" stop-color="#e6b422"/>
      <stop offset="100%" stop-color="#b3830f"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9e08b"/>
      <stop offset="55%" stop-color="#e6b422"/>
      <stop offset="100%" stop-color="#c1900f"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 262) scale(0.97) translate(-256 -238)">

  <!-- crown -->
  <path d="M172 118 L172 66 L206 96 L256 44 L306 96 L340 66 L340 118 Z"
        fill="url(#gold)" stroke="#7d5c08" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="256" cy="40" r="12" fill="#f7d97a" stroke="#7d5c08" stroke-width="4"/>

  <!-- ears -->
  <circle cx="152" cy="212" r="54" fill="url(#fur)" stroke="#6b4d05" stroke-width="7"/>
  <circle cx="360" cy="212" r="54" fill="url(#fur)" stroke="#6b4d05" stroke-width="7"/>
  <circle cx="152" cy="212" r="25" fill="#8a5a2b"/>
  <circle cx="360" cy="212" r="25" fill="#8a5a2b"/>

  <!-- head -->
  <ellipse cx="256" cy="308" rx="140" ry="126" fill="url(#fur)" stroke="#6b4d05" stroke-width="8"/>

  <!-- muzzle -->
  <ellipse cx="256" cy="364" rx="76" ry="58" fill="#f6e6bd" stroke="#6b4d05" stroke-width="6"/>
  <path d="M232 348 Q256 336 280 348 Q280 366 256 372 Q232 366 232 348 Z" fill="#20160a"/>
  <path d="M256 372 L256 392 M256 392 Q236 404 222 390 M256 392 Q276 404 290 390"
        stroke="#20160a" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- eyes -->
  <ellipse cx="204" cy="278" rx="18" ry="17" fill="#1a1206"/>
  <ellipse cx="308" cy="278" rx="18" ry="17" fill="#1a1206"/>
  <circle cx="210" cy="269" r="6" fill="#ffffff" opacity="0.9"/>
  <circle cx="314" cy="269" r="6" fill="#ffffff" opacity="0.9"/>

  <!-- brow, to stop it reading as a teddy bear -->
  <path d="M178 246 L228 258 M334 246 L284 258" stroke="#5c4204" stroke-width="15" stroke-linecap="round"/>
  </g>
  <circle cx="256" cy="256" r="238" fill="none" stroke="url(#gold)" stroke-width="10" opacity="0.5"/>
</svg>
