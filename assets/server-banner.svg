<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- Soundbard Dominion banner: the hooded bard on the right, a trail of chimes arcing in from the left. -->
  <defs>
    <radialGradient id="cosmos" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#3b3fa8"/><stop offset="50%" stop-color="#1c1c62"/><stop offset="100%" stop-color="#080822"/>
    </radialGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffaf0"/><stop offset="60%" stop-color="#efe1c2"/><stop offset="100%" stop-color="#c9b48a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe89a"/><stop offset="52%" stop-color="#f0b82a"/><stop offset="100%" stop-color="#b07a0a"/>
    </linearGradient>
    <radialGradient id="void" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1d1f5c"/><stop offset="100%" stop-color="#05061a"/>
    </radialGradient>
    <radialGradient id="chimeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a0" stop-opacity="0.9"/><stop offset="100%" stop-color="#ffcf4a" stop-opacity="0"/>
    </radialGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a2a"/><stop offset="45%" stop-color="#22237a"/><stop offset="100%" stop-color="#3a2a7a"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6c63ff" stop-opacity="0.55"/><stop offset="100%" stop-color="#6c63ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05061a" stop-opacity="0"/><stop offset="100%" stop-color="#05061a" stop-opacity="0.75"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#sky)"/>
