ty="0.7"/><circle cx="557" cy="199" r="2.5" opacity="0.5"/><circle cx="717" cy="273" r="1.5" opacity="0.7"/><circle cx="931" cy="409" r="3" opacity="0.7"/><circle cx="418" cy="211" r="1.5" opacity="0.7"/><circle cx="659" cy="215" r="1.5" opacity="0.5"/><circle cx="78" cy="116" r="3" opacity="0.5"/><circle cx="122" cy="184" r="1.5" opacity="0.5"/><circle cx="10" cy="300" r="2" opacity="0.9"/><circle cx="113" cy="196" r="1.5" opacity="0.5"/><circle cx="905" cy="116" r="3" opacity="0.5"/><circle cx="659" cy="139" r="2.5" opacity="0.9"/><circle cx="382" cy="252" r="1.5" opacity="0.5"/><circle cx="879" cy="259" r="3" opacity="0.7"/><circle cx="505" cy="169" r="1.5" opacity="0.5"/><circle cx="114" cy="393" r="2.5" opacity="0.9"/><circle cx="281" cy="255" r="2" opacity="0.9"/><circle cx="33" cy="115" r="2.5" opacity="0.5"/><circle cx="716" cy="288" r="1.5" opacity="0.9"/><circle cx="315" cy="339" r="1.5" opacity="0.9"/><circle cx="875" cy="143" r="2.5" opacity="0.5"/><circle cx="374" cy="405" r="2" opacity="0.9"/><circle cx="564" cy="408" r="2.5" opacity="0.9"/><circle cx="238" cy="323" r="2" opacity="0.5"/><circle cx="847" cy="215" r="2" opacity="0.5"/><circle cx="540" cy="262" r="2.5" opacity="0.9"/><circle cx="39" cy="24" r="2.5" opacity="0.7"/><circle cx="275" cy="109" r="2.5" opacity="0.7"/><circle cx="837" cy="380" r="2.5" opacity="0.7"/></g>
  <circle cx="660" cy="300" r="300" fill="url(#halo)"/>
  <!-- sound waves rolling out of the hood -->
